services:
  db:
    image: postgres:16.4-alpine
    container_name: techworld-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: techworlddb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port NOT exposed to host — accessible only within backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d techworlddb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techworld-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=techworlddb;Username=postgres;Password=${DB_PASSWORD}"
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: TechWorld
      JwtSettings__Audience: TechWorldClient
      JwtSettings__ExpiresInMinutes: 60
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:5274
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost}
    # Port intentionally NOT exposed — all traffic routes through nginx on port 80
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5274/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend-net
      - frontend-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  frontend:
    build:
      context: ../Ecommerc-tec
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: techworld-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Port NOT exposed — Caddy proxies to this container internally
    networks:
      - frontend-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  caddy:
    image: caddy:2.8-alpine
    container_name: techworld-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    networks:
      - frontend-net
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

networks:
  backend-net:
  frontend-net:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
